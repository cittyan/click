name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - 8.4.1-zh # 仅在您指定的分支提交时触发

# 必须设置以下权限，允许工作流直接与 GitHub Pages API 通信
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material

      - name: Build Docs
        run: |
          mkdocs build # 仅编译输出到 site/ 文件夹，不推送到任何分支

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site # 将 MkDocs 生成的静态网页目录打包上传

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 直接部署到 GitHub Pages 服务器
