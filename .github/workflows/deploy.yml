name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - 8.4.1-zh # 仅在您指定的分支提交时触发

# 赋予工作流直接与 GitHub Pages API 通信的写入权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5 # 自动配置 GitHub Pages 环境

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1 # 官方 Jekyll 编译动作
        with:
          source: ./ # 指定根目录，因为 docs/ 在其下方
          destination: ./_site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # 将 Jekyll 编译出的静态网页打包上传

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 直接空投部署到 Pages 服务器
